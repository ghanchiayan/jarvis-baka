<h1 style="color:#0ff">🤖 JARVIS V2 BAKA - FINAL</h1>
<div id="jarvis">🧠</div>
<div id="text">Iron Man JARVIS Ready Baka!</div>

<button onclick="start()">🎤 Bolo Baka</button>
<button onclick="testIron()" style="background:gold">🔊 Iron Man Voice Test</button>

<div style="width:100%">
<select id="voiceSelect"><option>Voice load thai che...</option></select>
<input id="in" placeholder="Type karo... 'call 123' 'battery' 'kya chu'">
<button onclick="fromInput()">Go</button>
</div>

<script>
let ironVoice=null; let voiceSelect=document.getElementById("voiceSelect");
function loadVoices(){
  let voices=speechSynthesis.getVoices();
  voiceSelect.innerHTML="";
  voices.forEach((v,i)=>{
    let o=document.createElement("option"); o.value=i; o.textContent=v.name+" ("+v.lang+")";
    if(v.name.includes("UK English Male")) o.textContent+=" ⭐ IRON MAN";
    voiceSelect.appendChild(o);
  });
  let saved=localStorage.getItem("baka_voice");
  if(saved && voices[saved]){ voiceSelect.value=saved; ironVoice=voices[saved]; }
  else{ ironVoice=voices.find(v=>v.name.includes("Google UK English Male"))||voices[0]; }
}
speechSynthesis.onvoiceschanged=loadVoices; setTimeout(loadVoices,800);
voiceSelect.onchange=()=>{ let v=speechSynthesis.getVoices(); ironVoice=v[voiceSelect.value]; localStorage.setItem("baka_voice",voiceSelect.value); speak("Yes Sir, voice updated"); }

function speak(t){
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(t);
  if(ironVoice) u.voice=ironVoice;
  u.pitch=0.6; u.rate=0.85;
  speechSynthesis.speak(u);
  document.getElementById("text").innerText="JARVIS: "+t;
}
function testIron(){ speak("Good Evening Sir. All systems nominal. I am fully operational."); }

function openApp(a,w){try{window.location.href=a;setTimeout(()=>window.open(w,"_blank"),1000)}catch(e){window.open(w,"_blank")}}
let inEl=document.getElementById("in");
function fromInput(){handle(inEl.value)}
function start(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;let r=new R();r.lang='en-IN';r.start();document.getElementById("text").innerText="Samhlu Chu Baka...";r.onresult=e=>{let c=e.results[0][0].transcript;inEl.value=c;handle(c)}}

async function handle(c){
 if(!c)return; c=c.toLowerCase().trim();
 if(c.includes("flash")){ speak("Flashlight Sir"); try{navigator.mediaDevices.getUserMedia({video:{torch:true}})}catch(e){} return; }
 if(c.includes("vibrate")){ navigator.vibrate([300,100,300]); speak("Vibration Sir"); return; }
 if(c.includes("battery")){ if(navigator.getBattery){ navigator.getBattery().then(b=>speak("Battery "+Math.round(b.level*100)+" percent Sir")); } return; }
 if(c.includes("call")||c.includes("phone")){ let num=c.replace(/[^0-9]/g,""); if(num.length>=7){ speak("Calling "+num); window.location.href="tel:"+num; } else speak("Number bolo Baka, call 9876543210"); return; }
 if(c.includes("insta")){ openApp("intent://instagram.com/#Intent;package=com.instagram.android;scheme=https;end","https://instagram.com"); speak("Opening Instagram"); return; }
 if(c.includes("youtube")||c.includes("yt")){ openApp("intent://www.youtube.com/#Intent;package=com.google.android.youtube;scheme=https;end","https://youtube.com"); return; }
 if(c.includes("whatsapp")&&c.includes("message")){ let m=c.split("message")[1]||"Hello"; openApp("intent://send?text="+encodeURIComponent(m)+"#Intent;package=com.whatsapp;scheme=whatsapp;end","https://web.whatsapp.com"); return; }
 if(c.includes("whatsapp")){ openApp("intent://send?#Intent;package=com.whatsapp;scheme=whatsapp;end","https://web.whatsapp.com"); return; }
 if(c.includes("location")||c.includes("kya chu")){ navigator.geolocation.getCurrentPosition(p=>{ speak("Location found Sir"); window.open("https://www.openstreetmap.org/?mlat="+p.coords.latitude+"&mlon="+p.coords.longitude,"_blank")}); return; }
 if(c.includes("time")||c.includes("samay")){ speak("Time is "+new Date().toLocaleTimeString()+" Sir"); return; }
 let q=c.replace("who is","").replace("what is","").replace("baka","").trim();
 if(q.length>2){ 
   speak("Searching "+q+" Sir");
   try{ let r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(q)); let d=await r.json(); if(d.extract){ speak(d.extract.slice(0,250)); document.getElementById("text").innerText=d.extract; } else speak("No data Sir, Google is blocked"); }catch(e){ speak("Wikipedia ma nathi malyu Sir, pan Google block che"); }
   return;
 }
 speak("Yes Sir, bolo");
}
</script>
</body>
</html>

<button onclick="fromInput()">Go</button>

<script>
const BAKA_NUMBER="7383935750";

function fromInput(){ handle(document.getElementById("in").value); }
function start(){
  let R=window.SpeechRecognition||window.webkitSpeechRecognition;
  let r=new R(); r.lang='en-IN'; r.start();
  r.onresult=e=>{ handle(e.results[0][0].transcript); }
}

async function pickContact(){
  if(!(navigator.contacts && navigator.contacts.select)){
    let num=prompt("Number lakho:");
    if(num){ localStorage.setItem("temp_tel",num); speak("Number save "+num+", Ha call kar bolo to call karis"); document.getElementById("text").innerText="Number: "+num+"\nHa Call Kar dabavo to j call thase"; }
    return;
  }
  try{
    const c=await navigator.contacts.select(['name','tel'],{multiple:false});
    if(c[0]){ localStorage.setItem("temp_tel",c[0].tel[0]); localStorage.setItem("temp_name",c[0].name[0]); speak("Selected "+c[0].name[0]+", Ha call kar bolo to j call karis"); document.getElementById("text").innerText=c[0].name[0]+" : "+c[0].tel[0]+"\nPermission vagar call nahi thay, Ha Call Kar bolo"; }
  }catch(e){}
}
function confirmCall(){
  let tel=localStorage.getItem("temp_tel")||BAKA_NUMBER;
  if(confirm("Call karu? "+tel)){ window.location.href="tel:"+tel; }else speak("Cancel karyu");
}
async function openCamera(){
  try{ let s=await navigator.mediaDevices.getUserMedia({video:true}); let v=document.createElement("video"); v.srcObject=s; v.autoplay=true; v.style.width="90%"; document.getElementById("text").innerHTML=""; document.getElementById("text").appendChild(v); setTimeout(()=>{ s.getTracks().forEach(t=>t.stop()); document.getElementById("text").innerText="Camera bandh - thodi permission puri"; },15000); }catch(e){ speak("Camera deny"); }
}
function openFiles(){
  let i=document.createElement("input"); i.type="file"; i.onchange=e=>{ let f=e.target.files[0]; document.getElementById("text").innerText="File: "+f.name+"\n"+Math.round(f.size/1024)+" KB - thodi permission"; speak("File "+f.name); }; i.click();
}
async function handle(c){
  if(!c) return; c=c.toLowerCase();
  if(c.includes("mane call kar")||c.includes("call me")){ localStorage.setItem("temp_tel",BAKA_NUMBER); speak("Tane call karu? Ha call kar bolo to j karis"); document.getElementById("text").innerText="Call: "+BAKA_NUMBER+"\nHa Call Kar bolo to j thase - permission vagar nahi"; navigator.vibrate([400,100,400]); return; }
  if(c.includes("ha call kar")){ confirmCall(); return; }
  if(c.includes("contact")){ pickContact(); return; }
  if(c.includes("camera")){ openCamera(); return; }
  if(c.includes("file")){ openFiles(); return; }
  if(c.includes("time")){ speak(new Date().toLocaleTimeString()); return; }
  try{ let r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(c)); let d=await r.json(); if(d.extract){ speak(d.extract.slice(0,180)); document.getElementById("text").innerText=d.extract; } }catch(e){}
}
</script>

async function handle(c){
  if(!c) return; c=c.toLowerCase();
  if(c.includes("mane call kar")||c.includes("call me")){ localStorage.setItem("temp_tel",BAKA_NUMBER); speak("Ready to call you, confirm karo"); document.getElementById("text").innerText="📞 "+BAKA_NUMBER+"\n✅ Ha Call Kar dabavo - permission vagar nahi"; navigator.vibrate([400,100,400]); return; }
  if(c.includes("ha call kar")){ confirmCall(); return; }
  if(c.includes("contact")){ pickContact(); return; }
  if(c.includes("camera")){ openCamera(); return; }
  if(c.includes("file")){ openFiles(); return; }
  if(c.includes("battery")){ if(navigator.getBattery){ let b=await navigator.getBattery(); speak("Battery "+Math.round(b.level*100)+" percent"); } return; }
  if(c.includes("kya chu")||c.includes("location")){ navigator.geolocation.getCurrentPosition(p=>window.open("https://www.openstreetmap.org/?mlat="+p.coords.latitude+"&mlon="+p.coords.longitude,"_blank")); return; }
  if(c.includes("time")){ speak(new Date().toLocaleTimeString()); return; }
  try{ let r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(c)); let d=await r.json(); if(d.extract){ document.getElementById("text").innerText=d.extract; speak(d.extract.slice(0,180)); } }catch(e){}
}
</script>
</body>
</html>
