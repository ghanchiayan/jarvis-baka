<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis Baka</title>
<style>
body{background:#000;color:#0ff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:monospace;text-align:center}
#jarvis{width:150px;height:150px;border:4px solid #0ff;border-radius:50%;box-shadow:0 0 30px #0ff;display:flex;align-items:center;justify-content:center;font-size:4em;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 20px #0ff}50%{box-shadow:0 0 40px #0ff}100%{box-shadow:0 0 20px #0ff}}
button{background:#0ff;color:#000;border:none;padding:15px 30px;font-size:1.2em;border-radius:30px;font-weight:bold;margin-top:20px}
#text{margin-top:20px;font-size:1.2em}
</style>
</head>
<body>
<h1>🤖 JARVIS BAKA</h1>
<div id="jarvis">🧠</div>
<div id="text">Ha Hukum Mere Aaka... Bolo Baka!</div>
<button id="btn">🎤 Bolo Baka</button>
<script>
const btn=document.getElementById('btn');const textDiv=document.getElementById('text');
function speak(t){let u=new SpeechSynthesisUtterance(t);u.lang='gu-IN';speechSynthesis.speak(u);textDiv.innerHTML=t;}
function handle(c){c=c.toLowerCase();if(c.includes('time')||c.includes('samay')){speak('Baka atyare samay che '+new Date().toLocaleTimeString())}else if(c.includes('hukum')){speak('Ha hukum mere aaka, bolo su kam che baka?')}else{speak('Tame kidhu: '+c)}}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let r=new SR();r.lang='gu-IN';
r.onstart=()=>btn.textContent='⏹️ Sambhlu Chu...';r.onend=()=>btn.textContent='🎤 Bolo Baka';
r.onresult=(e)=>handle(e.results[0][0].transcript);btn.onclick=()=>r.start();
setTimeout(()=>speak('Ha hukum mere aaka! Jarvis Baka taiyar che!'),1000);
</script>
</body>
</html>
