<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS 2 IN 1 FINAL</title>
<style>
body{background:#000;color:#0ff;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:monospace;text-align:center;padding:10px;margin:0}
#jarvis{width:160px;height:160px;border:4px solid #0ff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:70px;box-shadow:0 0 35px #0ff;margin:10px}
#text{margin:10px;background:#111;padding:14px;border-radius:12px;border:1px solid #0ff88;width:90%;min-height:40px}
button{border:none;padding:12px 20px;border-radius:24px;font-weight:bold;margin:5px}
select,input{padding:12px;width:90%;border-radius:22px;border:1px solid #0ff;background:#111;color:#fff;margin:5px}
</style>
</head>
<body>
<h3 style="color:#0ff">🤖 JARVIS V2 - 2 IN 1 FINAL - CLEAN</h3>
<div id="jarvis">🧠</div>
<div id="text">Good Evening Sir. I am fully operational. Ready Baka!</div>

<button onclick="start()" style="background:#0ff;color:#000">🎤 Bolo Baka</button>
<button onclick="ironTest()" style="background:#ffcc00">🔊 Iron Voice</button>
<select id="vs"><option>Loading...</option></select>

<div>
<button onclick="handle('mane call kar')" style="background:#ff0055;color:#fff">📞 Mane Call Kar</button>
<button onclick="pickContact()" style="background:#ffaa00">👥 Contact</button>
<button onclick="openCamera()" style="background:#aa00ff;color:#fff">📷 Camera</button>
<button onclick="openFiles()" style="background:#00aaff;color:#fff">📁 Files</button>
</div>
<button onclick="confirmCall()" style="background:#fff">✅ Ha Call Kar</button>
<button onclick="speak('Limited permission granted')" style="background:#00ff88">🔒 4 Permission+</button>

<input id="in" placeholder="Bolo: battery, kya chu, google iron man">
<button onclick="handle(document.getElementById('in').value)" style="background:#0ff;color:#000;padding:12px 30px">Go</button>

<script>
const BAKA_NUMBER="7383935750";
let ironVoice=null;
function loadV(){ let v=speechSynthesis.getVoices(); let sel=document.getElementById("vs"); sel.innerHTML=""; v.forEach((vo,i)=>{ let o=document.createElement("option"); o.value=i; o.textContent=vo.name; sel.appendChild(o); }); ironVoice=v.find(x=>x.name.includes("Google UK English Male"))||v[0]; }
speechSynthesis.onvoiceschanged=loadV; setTimeout(loadV,800);
function speak(t){ speechSynthesis.cancel(); let u=new SpeechSynthesisUtterance(t); if(ironVoice) u.voice=ironVoice; u.pitch=0.6; u.rate=0.85; speechSynthesis.speak(u); document.getElementById("text").innerText=t; }
function ironTest(){ speak("Good Evening Sir, I am fully operational, ready Baka"); }
function start(){ let R=window.SpeechRecognition||window.webkitSpeechRecognition; let r=new R(); r.lang='en-IN'; r.start(); document.getElementById("text").innerText="Samhlu Chu..."; r.onresult=e=>{ document.getElementById("in").value=e.results[0][0].transcript; handle(e.results[0][0].transcript); } }
async function pickContact(){ if(!(navigator.contacts && navigator.contacts.select)){ let n=prompt("Number:"); if(n) localStorage.setItem("temp_tel",n); return; } try{ let c=await navigator.contacts.select(['name','tel'],{multiple:false}); if(c[0]){ localStorage.setItem("temp_tel",c[0].tel[0]); localStorage.setItem("temp_name",c[0].name[0]); } }catch(e){} }
function confirmCall(){ let tel=localStorage.getItem("temp_tel")||BAKA_NUMBER; if(confirm("Call "+tel+" ?")) window.location.href="tel:"+tel; }
async function openCamera(){ try{ let s=await navigator.mediaDevices.getUserMedia({video:true}); let v=document.createElement("video"); v.srcObject=s; v.autoplay=true; v.style.width="90%"; v.style.border="2px solid #0ff"; v.style.borderRadius="12px"; let box=document.getElementById("text"); box.innerHTML=""; box.appendChild(v); setTimeout(()=>{ s.getTracks().forEach(t=>t.stop()); box.innerText="Camera OFF"; },15000); }catch(e){} }
function openFiles(){ let i=document.createElement("input"); i.type="file"; i.onchange=e=>{ let f=e.target.files[0]; document.getElementById("text").innerText="📁 "+f.name; }; i.click(); }
async function handle(c){
  if(!c) return; c=c.toLowerCase();
  if(c.includes("mane call kar")){ localStorage.setItem("temp_tel",BAKA_NUMBER); speak("Ready to call, confirm Ha Call Kar"); document.getElementById("text").innerText="📞 "+BAKA_NUMBER+" Ha dabavo"; return; }
  if(c.includes("ha call kar")){ confirmCall(); return; }
  if(c.includes("contact")){ pickContact(); return; }
  if(c.includes("camera")){ openCamera(); return; }
  if(c.includes("file")){ openFiles(); return; }
  if(c.includes("battery")){ if(navigator.getBattery){ let b=await navigator.getBattery(); speak("Battery "+Math.round(b.level*100)+" percent"); } return; }
  if(c.includes("kya chu")){ navigator.geolocation.getCurrentPosition(p=>window.open("https://www.openstreetmap.org/?mlat="+p.coords.latitude+"&mlon="+p.coords.longitude,"_blank")); return; }
  if(c.includes("time")){ speak(new Date().toLocaleTimeString()); return; }
  let q=c.replace("google","").trim();
  try{ let r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(q)); let d=await r.json(); if(d.extract){ document.getElementById("text").innerText=d.extract; speak(d.extract.slice(0,150)); return; } }catch(e){}
  window.open("https://www.google.com/search?q="+encodeURIComponent(q),"_blank");
}
</script>
</body>
</html>
