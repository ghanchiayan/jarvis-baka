<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AUTO</title>
<style>
body{background:#000;color:#0ff;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:monospace;text-align:center;padding:20px}
#j{width:140px;height:140px;border:4px solid #0ff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:70px;box-shadow:0 0 30px #0ff}
input,button,select{margin:5px;padding:12px;background:#111;color:#0ff;border:1px solid #0ff;border-radius:10px}
#log{width:90%;max-width:400px;background:#111;padding:10px;border:1px solid #0ff;text-align:left;min-height:50px}
</style>
</head>
<body>
<h3>🤖 JARVIS - AUTO MODE</h3>
<div id="j">🧠</div>
<p id="st">Ready Baka - Auto Che!</p>
<input id="cmd" type="text" placeholder="Lakh Baka - Auto Chalse!" style="width:85%;max-width:320px;font-size:16px">
<div id="log">Log: Ready...</div>
<button id="mic">🎤 Bolo Baka</button>

<script>
let t=null;
let log=document.getElementById('log');
let st=document.getElementById('st');
function addLog(m){log.innerHTML+="<br>> "+m;log.scrollTop=log.scrollHeight}
function speak(m){st.innerText=m;speechSynthesis.speak(new SpeechSynthesisUtterance(m));addLog(m)}
function run(){
 let q=document.getElementById('cmd').value.toLowerCase().trim();
 if(q.length<2) return;
 addLog("Auto Command: "+q);
 if(q.includes('battery')){navigator.getBattery().then(b=>speak("Battery "+Math.round(b.level*100)+" percent Baka"))}
 else if(q.includes('time')||q.includes('samay')){speak("Time "+new Date().toLocaleTimeString()+" Baka")}
 else if(q.includes('google')||q.length>3){window.open("https://www.google.com/search?q="+q);speak("Search karyu "+q+" Baka")}
}
// AUTO - Lakhse etle 1 second pachi apome chalse!
document.getElementById('cmd').addEventListener('input',()=>{
 clearTimeout(t);
 t=setTimeout(run,1200);
});
// Mic mate
document.getElementById('mic').addEventListener('click',()=>{
 let r=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
 r.lang='gu-IN';r.start();
 r.onresult=(e)=>{document.getElementById('cmd').value=e.results[0][0].transcript;run()}
});
speak("Auto JARVIS Ready Baka - Have Kai Dabvu Nathi Padtu!");
</script>
</body>
</html>
