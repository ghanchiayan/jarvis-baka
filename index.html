<script>
// ... same upar nu code same rakh, fakt niche no handle() function badlo ...

async function handle(c){
  if(!c) return; c=c.toLowerCase();
  if(c.includes("mane call kar")||c.includes("call me")){ localStorage.setItem("temp_tel",BAKA_NUMBER); speak("Ready to call you, confirm Ha Call Kar"); document.getElementById("text").innerText="📞 Call: "+BAKA_NUMBER+"\n✅ Ha Call Kar dabavo"; navigator.vibrate([400,100,400]); return; }
  if(c.includes("ha call kar")){ confirmCall(); return; }
  if(c.includes("contact")){ pickContact(); return; }
  if(c.includes("camera")){ openCamera(); return; }
  if(c.includes("file")){ openFiles(); return; }
  if(c.includes("battery")){ if(navigator.getBattery){ let b=await navigator.getBattery(); speak("Battery "+Math.round(b.level*100)+" percent Sir"); document.getElementById("text").innerText="🔋 Battery: "+Math.round(b.level*100)+"%"; } return; }
  if(c.includes("kya chu")||c.includes("location")){ navigator.geolocation.getCurrentPosition(p=>window.open("https://www.openstreetmap.org/?mlat="+p.coords.latitude+"&mlon="+p.coords.longitude,"_blank")); return; }
  if(c.includes("time")){ speak(new Date().toLocaleTimeString()); return; }

  // GOOGLE THODI PERMISSION - LIMITED
  let q=c.replace("who is","").replace("what is","").replace("google","").replace("baka","").trim();
  if(q.length>1){
    // Pehla Wikipedia try
    try{
      let r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(q));
      let d=await r.json();
      if(d.extract){
        document.getElementById("text").innerText="📖 Wiki: "+d.extract+"\n\n🔍 Google thodi permission - niche Google pan khulshe";
        speak(d.extract.slice(0,180)+" Sir, plus Google ma pan joi lo");
        // Thodi Google - new tab ma khole, full access nahi
        setTimeout(()=>window.open("https://www.google.com/search?q="+encodeURIComponent(q),"_blank"),1500);
        return;
      }
    }catch(e){}

    // Wiki ma nathi malyu to Google thodi permission
    speak("Wikipedia ma nathi, Google ma search karu chu Sir, thodi permission");
    document.getElementById("text").innerText="🔍 Searching Google (Thodi Permission): "+q+"\n\nGoogle khuli rahyu che... limited!";
    window.open("https://www.google.com/search?q="+encodeURIComponent(q),"_blank");
  }
}
</script>
