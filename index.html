<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JARVIS BAKA</title><style>body{background:#000;color:#0ff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;text-align:center}#jarvis{width:150px;height:150px;border:4px solid #0ff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:70px;box-shadow:0 0 30px #0ff}button{background:#0ff;color:#000;border:none;padding:12px 30px;border-radius:30px;font-weight:bold;margin:10px;font-size:18px}#text{margin-top:20px;font-size:1.2em}input{padding:12px;width:70%;border-radius:20px;border:1px solid #0ff;background:#111;color:#fff}</style></head><body><h1>🧔 JARVIS BAKA</h1><div id="jarvis">🧔</div><div id="text">No Chrome Mode Ready Baka!</div><br><button onclick="start()">🎤 Bolo Baka</button><div><input id="in" placeholder="Type karo..."><button onclick="fromInput()">Go</button></div><script>let voices=[];function loadV(){voices=speechSynthesis.getVoices()}speechSynthesis.onvoiceschanged=loadV;loadV();function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);let m=voices.find(v=>v.name.toLowerCase().includes("male"))||voices[0];if(m)u.voice=m;u.pitch=0.75;u.rate=0.85;speechSynthesis.speak(u);document.getElementById("text").innerText=t}function openApp(a,w){speak("Kholi Rahyo Chu");try{window.location.href=a;setTimeout(()=>window.open(w,"_blank"),1500)}catch(e){window.open(w,"_blank")}}function start(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;let r=new R();r.lang='en-IN';r.start();text.innerText="Samhlu Chu...";r.onresult=e=>{let cmd=e.results[0][0].transcript;inEl.value=cmd;handle(cmd)}}let inEl=document.getElementById("in");let text=document.getElementById("text");function fromInput(){handle(inEl.value)}function handle(c){if(!c)return;c=c.toLowerCase();if(c.includes("time")||c.includes("samay"))speak("Time "+new Date().toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata'}));else if(c.includes("insta"))openApp("intent://instagram.com/#Intent;package=com.instagram.android;scheme=https;end","https://instagram.com");else if(c.includes("youtube")||c.includes("yt"))openApp("intent://www.youtube.com/#Intent;package=com.google.android.youtube;scheme=https;end","https://youtube.com");else if(c.includes("whatsapp")||c.includes("wp"))openApp("intent://send?#Intent;package=com.whatsapp;scheme=whatsapp;end","https://web.whatsapp.com");else if(c.includes("song")||c.includes("play")){let q=c.replace("play","");openApp("intent://www.youtube.com/results?search_query="+q+"#Intent;package=com.google.android.youtube;scheme=https;end","https://www.youtube.com/results?search_query="+q)}else{let q=c;speak("Searching "+q);window.open("https://google.com/search?q="+q,"_blank")}}inEl.addEventListener("keypress",e=>{if(e.key=="Enter")fromInput()})</script></body></html>
