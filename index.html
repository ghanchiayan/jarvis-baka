!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAKA HUMANOID JARVIS</title>
<style>
body{background:radial-gradient(circle at center,#0a0a0a,#000);color:#0ff;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:monospace;padding:15px}
#humanoid{width:160px;height:200px;position:relative;margin:10px}
#head{width:80px;height:90px;background:linear-gradient(#222,#000);border:2px solid #0ff;border-radius:40% 40% 20% 20%;margin:0 auto;position:relative;box-shadow:0 0 20px #0ff;display:flex;align-items:center;justify-content:center}
#eyes{width:50px;display:flex;justify-content:space-between}
.eye{width:14px;height:8px;background:#0ff;border-radius:50%;box-shadow:0 0 10px #0ff;animation:blink 3s infinite}
@keyframes blink{0%,90%,100%{height:8px}95%{height:1px}}
#brain{width:100px;height:60px;border:1px solid #0ff;border-radius:10px;margin:10px auto;background:radial-gradient(#003,#000);display:flex;align-items:center;justify-content:center;font-size:30px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 10px #0ff}50%{box-shadow:0 0 30px #0ff}}
input,button{margin:5px;padding:14px;background:#111;color:#0ff;border:1px solid #0ff;border-radius:12px;width:90%;max-width:380px}
#log{width:92%;max-width:400px;background:#111;padding:10px;border:1px solid #0ff;min-height:80px;color:#ff0;font-size:13px;text-align:left}
</style>
</head>
<body>
<h3>🤖 BAKA HUMANOID JARVIS 🧠</h3>
<div id="humanoid"><div id="head"><div id="eyes"><div class="eye"></div><div class="eye"></div></div></div><div id="brain">🧠</div></div>
<p id="st">Hu Humaniid Bani Gayo Baka!</p>
<input id="cmd" type="text" placeholder="Bol Baka - open instagram">
<button id="goBtn" style="background:#003300;color:#0f0;border-color:#0f0">▶️ ENTER</button>
<div id="log">Log: Humanoid Ready...</div>
<button id="mic">🎤 Hey JARVIS</button>
<script>
let log=document.getElementById('log'), st=document.getElementById('st'), eyes=document.querySelectorAll('.eye');
function addLog(m){log.innerHTML+="<br>> "+m;log.scrollTop=log.scrollHeight}
function speak(m){st.innerText=m; eyes.forEach(e=>e.style.background='#0f0'); setTimeout(()=>eyes.forEach(e=>e.style.background='#0ff'),1000); speechSynthesis.speak(new SpeechSynthesisUtterance(m)); addLog(m)}
function handle(){
 let q=document.getElementById('cmd').value.toLowerCase().trim(); if(!q)return; addLog("YOU: "+q);
 q=q.replace('hey jarvis','').trim();
 if(q.includes('open instagram')){speak("Opening Instagram Baka - Humanoid style!"); window.open("https://instagram.com","_blank");}
 else if(q.includes('open youtube')){speak("YouTube kholu chu Baka"); window.open("https://youtube.com","_blank");}
 else if(q.includes('open whatsapp')){speak("WhatsApp kholu chu"); window.open("https://web.whatsapp.com","_blank");}
 else { let p=confirm("Google ma '"+q+"' search karu Baka? Permission?"); if(p){window.open("https://google.com/search?q="+q,"_blank"); speak("Search karyu Baka");} else speak("Cancel Baka - Permission nathi!");}
}
document.getElementById('goBtn').addEventListener('click',handle);
document.getElementById('cmd').addEventListener('keydown',e=>{if(e.key==='Enter')handle()});
document.getElementById('mic').addEventListener('click',()=>{let R=new (window.SpeechRecognition||window.webkitSpeechRecognition)(); R.lang='en-IN'; R.start(); R.onresult=ev=>{document.getElementById('cmd').value=ev.results[0][0].transcript; handle();}});
speak("Hu Humaniid JARVIS chu Baka! Bol open instagram!");
</script>
</body>
</html>
